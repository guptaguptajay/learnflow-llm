name: Release and Deploy

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPO: ${{ secrets.AWS_ECR_REPO }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ secrets.ECS_TASK_FAMILY }}
  IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.AWS_ECR_REPO }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (CI only)
        working-directory: microservice
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: microservice
        run: pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: learnflow-deploy

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: microservice
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          COMMIT_SHA=${GITHUB_SHA::7}
          docker build -t "$IMAGE_URI:latest" -t "$IMAGE_URI:$COMMIT_SHA" -f Dockerfile .
          docker push "$IMAGE_URI:latest"
          docker push "$IMAGE_URI:$COMMIT_SHA"
          echo "IMAGE_TAG=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Render task definition with image and region/account
        run: |
          sed -e "s#YOUR_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/learnflow/microservice:latest#${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}#g" \
              -e "s#arn:aws:iam::YOUR_ACCOUNT_ID:role/ecsTaskExecutionRole#arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole#g" \
              -e "s#arn:aws:iam::YOUR_ACCOUNT_ID:role/ecsTaskRole#arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskRole#g" \
              -e "s#YOUR_REGION#${{ env.AWS_REGION }}#g" \
              -e "s#YOUR_ACCOUNT_ID#${{ env.AWS_ACCOUNT_ID }}#g" \
            taskdef.json > taskdef.rendered.json

      - name: Register new task definition
        id: register_task
        run: |
          REVISION=$(aws ecs register-task-definition --cli-input-json file://taskdef.rendered.json \
            --query 'taskDefinition.revision' --output text)
          echo "REVISION=$REVISION" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "${{ env.ECS_TASK_FAMILY }}:${{ steps.register_task.outputs.REVISION }}" \
            --force-new-deployment

      - name: Wait for deployment stabilization
        run: |
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ env.IMAGE_TAG }}
          name: Release v${{ github.run_number }}-${{ env.IMAGE_TAG }}
          generate_release_notes: true
